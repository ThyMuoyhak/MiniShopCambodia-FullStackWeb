# Frontend_Telegram_Mini_APP on Netlify
# Import the GitHub repo in Netlify - settings below are used automatically.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

# LOCAL STUDY COPY: same-origin API proxy -> YOUR OWN backend.
# Replace http://localhost:8000 with your deployed API URL when you go live.
[[redirects]]
  from = "/api/*"
  to = "http://localhost:8000/api/:splat"
  status = 200

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the app shell.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Versioned assets are cacheable.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
